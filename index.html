<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#FBF7EF" />
<title>Draw Easy</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Lalezar&family=Cairo:wght@400;600;700;800&display=swap');

  :root{
    --paper:#FBF7EF;
    --paper-line:#E8E0D0;
    --ink:#2E2A26;
    --ink-soft:#6B6259;
    --coral:#FF6B6B;
    --teal:#2FA99A;
    --sun:#F2B33D;
    --violet:#8B7CD9;
    --card-shadow: 0 6px 18px -8px rgba(46,42,38,0.25);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--paper);
    background-image:
      radial-gradient(circle at 1px 1px, var(--paper-line) 1px, transparent 0);
    background-size: 22px 22px;
    color:var(--ink);
    font-family:'Cairo', sans-serif;
    overflow-x:hidden;
  }
  h1,h2,h3,.display{ font-family:'Lalezar', 'Cairo', sans-serif; letter-spacing:0.5px; }

  /* ---------- Header ---------- */
  header.top{
    padding:22px 18px 14px;
    text-align:center;
  }
  .logo-row{ display:flex; align-items:center; justify-content:center; gap:10px; }
  .logo-dot{
    width:34px; height:34px; border-radius:50%;
    background:conic-gradient(var(--coral),var(--sun),var(--teal),var(--violet),var(--coral));
    box-shadow: inset 0 0 0 3px var(--paper), 0 0 0 2px var(--ink);
  }
  header.top h1{ font-size:30px; margin:0; color:var(--ink); }
  header.top p{ margin:4px 0 0; font-size:13px; color:var(--ink-soft); }

  /* ---------- Filter chips ---------- */
  .chips{
    display:flex; gap:8px; padding:4px 18px 18px; overflow-x:auto;
    justify-content:center; flex-wrap:wrap;
  }
  .chip{
    font-family:'Cairo'; font-weight:700; font-size:13px;
    padding:8px 16px; border-radius:999px; border:2px solid var(--ink);
    background:var(--paper); color:var(--ink); cursor:pointer; white-space:nowrap;
  }
  .chip.active{ background:var(--ink); color:var(--paper); }

  /* ---------- Grid ---------- */
  .grid{
    display:grid; grid-template-columns:repeat(2,1fr); gap:14px;
    padding:0 16px 40px; max-width:520px; margin:0 auto;
  }
  .card{
    background:#fff; border:2.5px solid var(--ink); border-radius:18px;
    padding:10px; box-shadow:var(--card-shadow); cursor:pointer;
    transform:rotate(var(--tilt,0deg));
    transition:transform .15s ease;
  }
  .card:active{ transform:scale(0.96) rotate(var(--tilt,0deg)); }
  .card canvas{ width:100%; aspect-ratio:1/1; display:block; border-radius:10px; background:var(--paper); }
  .card .meta{ display:flex; align-items:center; justify-content:space-between; margin-top:8px; }
  .card .title{ font-weight:800; font-size:14px; }
  .pill{ font-size:10px; font-weight:800; padding:3px 9px; border-radius:999px; color:#fff; }
  .pill.easy{ background:var(--teal); }
  .pill.medium{ background:var(--sun); color:var(--ink); }
  .pill.hard{ background:var(--coral); }

  /* ---------- Lesson view ---------- */
  #lessonView{ display:none; padding:14px 14px 30px; max-width:480px; margin:0 auto; }
  .lesson-header{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .back-btn{
    width:38px; height:38px; border-radius:50%; border:2px solid var(--ink);
    background:#fff; font-size:18px; display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .lesson-title{ font-size:22px; margin:0; }
  .step-dots{ display:flex; gap:6px; justify-content:center; margin:6px 0 12px; }
  .dot{ width:9px; height:9px; border-radius:50%; background:var(--paper-line); border:1.5px solid var(--ink); }
  .dot.on{ background:var(--sun); }

  .sketchpad{
    position:relative; background:#fff; border-radius:16px;
    border:2.5px solid var(--ink); box-shadow:var(--card-shadow);
    padding:12px 12px 12px 26px; margin-bottom:12px;
  }
  .spiral{
    position:absolute; right:-1px; top:14px; bottom:14px; width:20px;
    background-image: radial-gradient(circle, var(--ink) 2.5px, transparent 2.6px);
    background-size: 16px 16px; background-repeat: repeat-y; background-position: center;
    opacity:0.55;
  }
  .canvas-wrap{ position:relative; width:100%; aspect-ratio:1/1; touch-action:none; }
  .canvas-wrap canvas{ position:absolute; inset:0; width:100%; height:100%; border-radius:10px; }
  #guideCanvas{ background:var(--paper); }
  #inkCanvas{ background:transparent; }

  .step-caption{ text-align:center; font-size:13px; color:var(--ink-soft); margin-top:6px; min-height:18px; }

  .step-nav{ display:flex; gap:10px; margin-bottom:14px; }
  .step-nav button{
    flex:1; padding:11px; border-radius:12px; border:2px solid var(--ink);
    font-family:'Cairo'; font-weight:800; font-size:14px; background:#fff; cursor:pointer;
  }
  .step-nav button.primary{ background:var(--ink); color:var(--paper); }
  .step-nav button:disabled{ opacity:0.35; }

  .tools{ background:#fff; border:2px solid var(--ink); border-radius:16px; padding:12px; }
  .tools-row{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .tools-row:last-child{ margin-bottom:0; }
  .swatch{
    width:28px; height:28px; border-radius:50%; border:2px solid var(--ink); cursor:pointer; flex:none;
  }
  .swatch.on{ box-shadow:0 0 0 3px var(--sun); }
  .tools label{ font-size:12px; font-weight:700; color:var(--ink-soft); white-space:nowrap; }
  #sizeRange{ flex:1; accent-color: var(--ink); }
  .clear-btn{
    margin-inline-start:auto; font-family:'Cairo'; font-weight:800; font-size:12px;
    border:2px solid var(--coral); color:var(--coral); background:#fff;
    padding:7px 12px; border-radius:10px; cursor:pointer;
  }

  .about-note{
    max-width:480px; margin:0 auto 30px; padding:0 18px;
    font-size:12px; color:var(--ink-soft); text-align:center; line-height:1.8;
  }

  .update-link{
    margin-top:10px; font-family:'Cairo'; font-weight:700; font-size:12px;
    border:none; background:none; color:var(--ink-soft); text-decoration:underline;
    cursor:pointer; padding:4px;
  }
  #updateToast{
    position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:var(--paper); font-family:'Cairo'; font-weight:700; font-size:13px;
    padding:12px 18px; border-radius:12px; display:none; z-index:50; box-shadow:var(--card-shadow);
    text-align:center; max-width:88vw;
  }
  #updateToast button{
    display:block; margin:8px auto 0; background:var(--sun); color:var(--ink); border:none;
    font-family:'Cairo'; font-weight:800; padding:7px 16px; border-radius:8px; cursor:pointer; font-size:12px;
  }

  .mode-toggle{
    display:flex; gap:6px; background:#fff; border:2px solid var(--ink); border-radius:12px;
    padding:4px; margin-bottom:12px;
  }
  .mode-btn{
    flex:1; padding:9px 6px; border-radius:9px; border:none; background:none;
    font-family:'Cairo'; font-weight:700; font-size:12.5px; color:var(--ink-soft); cursor:pointer;
  }
  .mode-btn.active{ background:var(--ink); color:var(--paper); }
</style>
</head>
<body>

<header class="top">
  <div class="logo-row">
    <div class="logo-dot"></div>
    <h1>علّمني الرسم</h1>
  </div>
  <p>دروس رسم خطوة بخطوة — تشتغل بدون نت</p>
  <button id="checkUpdateBtn" class="update-link">🔄 تحقق من تحديثات</button>
</header>

<div class="chips" id="chips"></div>
<div class="grid" id="grid"></div>

<p class="about-note">
  كل الدروس محفوظة جوا التطبيق وتشتغل بدون إنترنت. لإضافة دروس جديدة بالمستقبل، لازم تحديث بسيط للتطبيق.
</p>

<div id="lessonView">
  <div class="lesson-header">
    <button class="back-btn" id="backBtn">→</button>
    <h2 class="lesson-title" id="lessonTitle"></h2>
  </div>
  <div class="mode-toggle" id="modeToggle">
    <button class="mode-btn active" data-mode="screen">🖐 أرسم عالشاشة</button>
    <button class="mode-btn" data-mode="paper">📓 أرسم عالدفتر</button>
  </div>
  <div class="step-dots" id="stepDots"></div>

  <div class="sketchpad">
    <div class="spiral"></div>
    <div class="canvas-wrap">
      <canvas id="guideCanvas" width="320" height="320"></canvas>
      <canvas id="inkCanvas" width="320" height="320"></canvas>
    </div>
    <div class="step-caption" id="stepCaption"></div>
  </div>

  <div class="step-nav">
    <button id="prevStep">◀ السابقة</button>
    <button id="nextStep" class="primary">التالية ▶</button>
  </div>

  <div class="tools">
    <div class="tools-row" id="swatchRow"></div>
    <div class="tools-row">
      <label>سماكة الفرشاة</label>
      <input type="range" id="sizeRange" min="2" max="14" value="5" />
      <button class="clear-btn" id="clearInk">امسح رسمتي</button>
    </div>
  </div>
</div>

<div id="updateToast"></div>

const DIFF_LABEL = { easy:'سهل', medium:'متوسط', hard:'صعب' };

/* ================= DRAW ENGINE ================= */
function drawShape(ctx, s, color, width, dashOverride){
  ctx.save();
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineWidth = width;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  if (s.dash || dashOverride) ctx.setLineDash([6,6]); else ctx.setLineDash([]);

  if (s.t === 'circle'){
    ctx.beginPath(); ctx.arc(s.cx, s.cy, s.r, 0, Math.PI*2);
    s.fill ? ctx.fill() : ctx.stroke();
  } else if (s.t === 'ellipse'){
    ctx.beginPath(); ctx.ellipse(s.cx, s.cy, s.rx, s.ry, (s.rot||0)*Math.PI/180, 0, Math.PI*2);
    ctx.stroke();
  } else if (s.t === 'line'){
    ctx.beginPath(); ctx.moveTo(s.x1,s.y1); ctx.lineTo(s.x2,s.y2); ctx.stroke();
  } else if (s.t === 'triangle'){
    ctx.beginPath(); ctx.moveTo(...s.p1); ctx.lineTo(...s.p2); ctx.lineTo(...s.p3); ctx.closePath(); ctx.stroke();
  } else if (s.t === 'curve'){
    const p = s.points;
    ctx.beginPath(); ctx.moveTo(p[0][0], p[0][1]);
    ctx.quadraticCurveTo(p[1][0], p[1][1], p[2][0], p[2][1]);
    ctx.stroke();
  } else if (s.t === 'arcline'){
    ctx.beginPath(); ctx.arc(s.cx, s.cy, s.r, s.a1*Math.PI/180, s.a2*Math.PI/180); ctx.stroke();
  } else if (s.t === 'rect'){
    ctx.beginPath(); ctx.rect(s.x, s.y, s.w, s.h); ctx.stroke();
  }
  ctx.restore();
}

function drawColorShape(ctx, s){
  ctx.save();
  ctx.globalAlpha = 0.55;
  ctx.fillStyle = s.color;
  if (s.t === 'circle'){
    ctx.beginPath(); ctx.arc(s.cx, s.cy, s.r, 0, Math.PI*2); ctx.fill();
  } else if (s.t === 'ellipse'){    ctx.beginPath(); ctx.ellipse(s.cx, s.cy, s.rx, s.ry, (s.rot||0)*Math.PI/180, 0, Math.PI*2); ctx.fill();
  } else if (s.t === 'triangle'){
    ctx.beginPath(); ctx.moveTo(...s.p1); ctx.lineTo(...s.p2); ctx.lineTo(...s.p3); ctx.closePath(); ctx.fill();
  } else if (s.t === 'rect'){
    ctx.beginPath(); ctx.rect(s.x, s.y, s.w, s.h); ctx.fill();
  }
  ctx.restore();
}

function renderGuide(ctx, lesson, currentStep){
  ctx.clearRect(0,0,320,320);
  for (let i=0; i<=currentStep; i++){
    const shapes = lesson.steps[i];
    const isCurrent = i === currentStep;
    shapes.forEach(s => {
      if (s.color) drawColorShape(ctx, s);
      else drawShape(ctx, s, isCurrent ? '#2FA99A' : '#C9C2B4', isCurrent ? 3 : 2.5, isCurrent);
    });
  }
}

function renderThumb(canvas, lesson){
  const ctx = canvas.getContext('2d');
  canvas.width = 300; canvas.height = 300;
  ctx.clearRect(0,0,300,300);
  lesson.steps.forEach(shapes => shapes.forEach(s => {
    if (s.color) drawColorShape(ctx, s);
    else drawShape(ctx, s, '#2E2A26', 3, false);
  }));
}

/* ================= HOME GRID ================= */
const grid = document.getElementById('grid');
const chipsEl = document.getElementById('chips');
let activeFilter = 'all';

function buildChips(){
  const filters = [['all','الكل'],['easy','سهل'],['medium','متوسط'],['hard','صعب']];
  chipsEl.innerHTML = '';
  filters.forEach(([key,label]) => {
    const c = document.createElement('div');
    c.className = 'chip' + (key===activeFilter ? ' active' : '');
    c.textContent = label;
    c.onclick = () => { activeFilter = key; buildChips(); buildGrid(); };
    chipsEl.appendChild(c);
  });
}

function buildGrid(){
  grid.innerHTML = '';
  const list = LESSONS.filter(l => activeFilter==='all' || l.difficulty===activeFilter);
  list.forEach((lesson, idx) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.style.setProperty('--tilt', ((idx%2===0?-1:1) * (1+ (idx%3))) + 'deg');
    const canvas = document.createElement('canvas');
    card.appendChild(canvas);
    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.innerHTML = `<span class="title">${lesson.title}</span><span class="pill ${lesson.difficulty}">${DIFF_LABEL[lesson.difficulty]}</span>`;
    card.appendChild(meta);
    card.onclick = () => openLesson(lesson);
    grid.appendChild(card);
    renderThumb(canvas, lesson);
  });
}

function setMode(m){
  drawMode = m;

  currentLesson = lesson;

  homeParts.forEach(el => el.style.display = 'none');
  lessonView.style.display = 'block';
  document.getElementById('lessonTitle').textContent = lesson.title;
  inkCtx.clearRect(0,0,320,320);
  setMode('screen');
  buildDots();
  refreshStep();
  window.scrollTo(0,0);
}

function closeLesson(){

}

function buildDots(){
  const dots = document.getElementById('stepDots');
  dots.innerHTML = '';
  currentLesson.steps.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'dot';
    dots.appendChild(d);

}

function refreshStep(){
  renderGuide(guideCtx, currentLesson, currentStep);
  document.getElementById('stepCaption').textContent =
    (currentLesson.captions && currentLesson.captions[currentStep]) || `الخطوة ${currentStep+1}`;
  [...document.getElementById('stepDots').children].forEach((d,i) => {
    d.classList.toggle('on', i<=currentStep);
  });
  document.getElementById('prevStep').disabled = currentStep === 0;
  const isLast = currentStep === currentLesson.steps.length - 1;
  const nextBtn = document.getElementById('nextStep');
  nextBtn.textContent = isLast ? 'خلصت الرسمة 🎉' : 'التالية ▶';
  nextBtn.disabled = isLast;
}

document.getElementById('prevStep').onclick = () => {
  if (currentStep > 0){ currentStep--; refreshStep(); }
};
document.getElementById('nextStep').onclick = () => {
  if (currentStep < currentLesson.steps.length - 1){ currentStep++; refreshStep(); }
};

  };
  swatchRow.appendChild(sw);
});
document.getElementById('sizeRange').oninput = (e) => brushSize = Number(e.target.value);

/* ---- drawing on ink canvas ---- */
let drawing = false, lastX=0, lastY=0;
function getPos(e){
  const rect = inkCanvas.getBoundingClientRect();
  const scaleX = 320/rect.width, scaleY = 320/rect.height;
  const p = e.touches ? e.touches[0] : e;
  return { x:(p.clientX-rect.left)*scaleX, y:(p.clientY-rect.top)*scaleY };
}
function start(e){ e.preventDefault(); drawing = true; const p = getPos(e); lastX=p.x; lastY=p.y; }
function move(e){
  if (!drawing) return;
  e.preventDefault();
  const p = getPos(e);
  inkCtx.strokeStyle = brushColor;
  inkCtx.lineWidth = brushSize;
  inkCtx.lineCap = 'round'; inkCtx.lineJoin = 'round';
  inkCtx.beginPath(); inkCtx.moveTo(lastX,lastY); inkCtx.lineTo(p.x,p.y); inkCtx.stroke();
  lastX=p.x; lastY=p.y;
}
function end(){ drawing = false; }
['mousedown','touchstart'].forEach(ev => inkCanvas.addEventListener(ev, start, {passive:false}));
['mousemove','touchmove'].forEach(ev => inkCanvas.addEventListener(ev, move, {passive:false}));
['mouseup','mouseleave','touchend'].forEach(ev => inkCanvas.addEventListener(ev, end));

/* ================= PWA / OFFLINE (manual updates only) ================= */
let waitingWorker = null;
const updateToast = document.getElementById('updateToast');

function showUpdateReady(){
  updateToast.innerHTML = 'في تحديث جديد جاهز 🎉<button id="applyUpdateBtn">حدّث الآن</button>';
  updateToast.style.display = 'block';
  document.getElementById('applyUpdateBtn').onclick = () => {
    if (waitingWorker) waitingWorker.postMessage({ type: 'SKIP_WAITING' });
  };
}

function showToastMsg(msg, ms){
  updateToast.innerHTML = msg;
  updateToast.style.display = 'block';
  setTimeout(() => { if (!waitingWorker) updateToast.style.display = 'none'; }, ms || 2500);
}

if ('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then((reg) => {
      // A worker already waiting from a previous check
      if (reg.waiting && navigator.serviceWorker.controller){
        waitingWorker = reg.waiting;
        showUpdateReady();
      }
      reg.addEventListener('updatefound', () => {
        const nw = reg.installing;
        if (!nw) return;
        nw.addEventListener('statechange', () => {
          if (nw.state === 'installed' && navigator.serviceWorker.controller){
            waitingWorker = nw;
            showUpdateReady();
          }
        });
      });
    }).catch(() => {});

    navigator.serviceWorker.addEventListener('controllerchange', () => {
      location.reload();
    });
  });
}

document.getElementById('checkUpdateBtn').onclick = () => {
  if (!('serviceWorker' in navigator)) return;
  showToastMsg('جارٍ التحقق من تحديثات…', 2500);
  navigator.serviceWorker.getRegistration().then((reg) => {
    if (reg) reg.update();
  });
};
